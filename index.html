.hero{background:radial-gradient(ellipse at 73% 50%,#17659a 0%,#102d57 30%,transparent 63%),linear-gradient(125deg,#06142d,#102a54);}
.hero-logo-card{width:min(320px,30vw);aspect-ratio:1;display:grid;place-items:center;background:#fff;border:1px solid rgba(255,255,255,.8);border-radius:32px;box-shadow:0 32px 90px #0006,0 0 0 12px #ffffff14;transform:rotate(-6deg);animation:logoFloat 6s ease-in-out infinite;overflow:hidden}
.hero-logo-card img{width:92%;height:92%;object-fit:contain}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(-3deg)}}
.cart-control{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;min-height:40px;position:relative}
.mini-stepper{width:112px;height:40px;display:flex;align-items:center;justify-content:space-between;border:1px solid #bedde9;border-radius:12px;background:#eef8ff;color:#123d63;overflow:hidden;position:relative;isolation:isolate}
.mini-stepper button{width:34px;height:100%;border:0;background:transparent;display:grid;place-items:center;color:#156eae;position:relative;z-index:1;touch-action:manipulation}
.mini-stepper button:active{background:#d8eefa}
.mini-stepper strong{font:800 13px Manrope,sans-serif;min-width:22px;text-align:center;position:relative;z-index:1}
.cart-control.pop .mini-stepper,.cart-control.pop .add{animation:microPop .28s cubic-bezier(.2,.8,.3,1)}
.cart-control.pop:after{content:'';position:absolute;inset:0;border-radius:12px;box-shadow:0 0 0 0 #2387c160;animation:microRing .38s ease-out;pointer-events:none}
@keyframes microPop{0%{transform:scale(.94)}60%{transform:scale(1.055)}100%{transform:scale(1)}}
@keyframes microRing{0%{box-shadow:0 0 0 0 #2387c166}100%{box-shadow:0 0 0 7px #2387c100}}
.cart-img{position:relative;border:1px solid #e4ecf3;background:#f1f6fb}
.cart-img img{display:block;position:relative;z-index:1}.cart-img img[hidden]{display:none!important}
.fallback-thumb{height:100%;width:100%;display:grid;place-items:center;font-size:38px;background:linear-gradient(145deg,#e9f6ff,#f4f6fa)}
.fallback-thumb[hidden]{display:none!important}
.cart-line .qty{display:none}
.cart-line .mini-stepper{height:33px;width:104px;border-radius:9px}
.cart-line .mini-stepper button{width:30px}
.cart-detail{min-width:0}
.cart-detail strong{overflow-wrap:anywhere}
.auth-open{overflow:hidden!important}
.auth-shell{position:fixed;inset:0;z-index:210;overflow-y:auto;background:radial-gradient(circle at 12% 8%,#d7efff 0%,transparent 33%),radial-gradient(circle at 95% 90%,#dce7ff 0%,transparent 36%),#f7faff;display:flex;align-items:center;justify-content:center;padding:24px 15px;animation:fade .24s}
.auth-layout{width:min(920px,100%);display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid #e3eaf4;border-radius:28px;overflow:hidden;box-shadow:0 30px 90px #10284c22;min-height:570px}
.auth-side{background:linear-gradient(155deg,#081c42,#12538a);color:#fff;padding:38px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-side:after{content:'';position:absolute;right:-120px;bottom:-170px;width:400px;height:400px;border:1px solid #ffffff20;border-radius:50%;box-shadow:0 0 0 55px #ffffff0a,0 0 0 125px #ffffff07;pointer-events:none}
.auth-logo{width:190px;height:208px;object-fit:contain;background:white;border-radius:22px;padding:6px;box-shadow:0 16px 55px #0003;align-self:center;margin:18px 0 20px}
.auth-side h1{font:800 33px/1.16 Manrope,sans-serif;letter-spacing:-1.4px;margin:10px 0 14px}
.auth-side p{color:#bed8ed;font-size:13px;line-height:1.8;max-width:320px}
.auth-side small{font-size:10px;color:#c8deee;letter-spacing:1px}
.auth-panel{padding:35px 36px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.auth-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:23px}
.auth-top .auth-kicker{font-size:10px;letter-spacing:2px;font-weight:900;color:#1476b3}
.auth-close{border:1px solid #e2eaf1;border-radius:10px;background:#fff;padding:8px 11px;color:#6c8090;font-size:11px;font-weight:800}
.auth-panel h2{font:800 26px/1.18 Manrope,sans-serif;letter-spacing:-.9px;margin:0 0 9px}
.auth-sub{font-size:12px;color:#788b9a;line-height:1.7;margin:0 0 21px}
.auth-primary{width:100%;border:0;border-radius:12px;background:#103b68;color:white;padding:14px 15px;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:9px}
.auth-secondary{width:100%;border:1px solid #dce7f0;border-radius:12px;background:#fff;color:#153e61;padding:13px 15px;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:9px}
.auth-secondary:hover,.provider:hover{background:#f2f8fd}
.auth-divider{display:flex;align-items:center;gap:10px;color:#9aa9b4;font-size:11px;margin:19px 0 14px}
.auth-divider:before,.auth-divider:after{content:'';height:1px;background:#e7edf2;flex:1}
.provider-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.provider{display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid #dce5ed;background:white;border-radius:11px;padding:12px 7px;font-size:11px;font-weight:800;color:#263d50;min-width:0}
.provider-icon{font:900 16px Arial,sans-serif}
.provider-google{color:#4285f4}.provider-apple{color:#101820}.provider-microsoft{color:#f25022}
.auth-guest{display:block;border:0;background:none;text-align:center;width:100%;font-weight:800;font-size:12px;color:#2675ac;margin-top:18px;padding:10px}
.auth-field{margin:0 0 13px}.auth-field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px;color:#365063}
.auth-field input{width:100%;border:1px solid #dce7f0;border-radius:11px;padding:12px 13px;font-size:13px;outline:0;color:#132f47;background:#fff}
.auth-field input:focus{border-color:#438dc5;box-shadow:0 0 0 3px #d6ecff}
.auth-notice{background:#f1f7ff;border:1px solid #d6e9fa;color:#325f80;border-radius:11px;padding:11px 12px;font-size:11px;line-height:1.6;margin:13px 0}
.auth-feedback{border-radius:10px;background:#fff2ed;border:1px solid #ffded2;color:#9a4735;padding:11px 12px;font-size:11px;line-height:1.6;margin:12px 0}
.auth-footer{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;color:#7d90a0;margin-top:14px}
.auth-footer button{border:0;background:none;color:#126caa;font-size:11px;font-weight:900;padding:4px}
.auth-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#54758f;background:#eff7ff;padding:8px 10px;border-radius:99px}
@media(max-width:730px){
 .brand-badge{width:40px;height:40px;min-width:40px}
 .hero-logo-card{width:154px;border-radius:20px;box-shadow:0 18px 38px #0006,0 0 0 6px #ffffff12}
 .hero-art{bottom:-13px;right:6px;width:165px;height:165px;opacity:1}
 .hero h1{font-size:42px}
 .hero-copy{padding-bottom:145px}
 .product-bottom{align-items:flex-start;flex-wrap:wrap;gap:7px}
 .product-bottom .cart-control{width:100%;min-height:34px}
 .product-bottom .cart-control .mini-stepper{width:100%;height:35px}
 .product-bottom .cart-control .add{width:100%;height:35px}
 .auth-shell{padding:0;align-items:stretch}
 .auth-layout{width:100%;border-radius:0;min-height:100dvh;display:flex;flex-direction:column}
 .auth-side{padding:20px 24px 15px;min-height:208px;flex-direction:row;align-items:center;gap:15px}
 .auth-side:after{right:-170px;bottom:-250px}
 .auth-side .auth-logo{width:118px;height:132px;margin:0;flex-shrink:0;border-radius:17px}
 .auth-side h1{font-size:22px;margin:0 0 7px;letter-spacing:-.8px}
 .auth-side p{font-size:11px;line-height:1.6;margin:0}
 .auth-side small{display:none}
 .auth-panel{padding:26px 25px 30px;flex:1;justify-content:flex-start}
 .auth-panel h2{font-size:24px}
 .provider{flex-direction:column;gap:5px;padding:11px 4px;font-size:10px}
 .auth-top{margin-bottom:20px}
}


/* Keep the complete uploaded FINORA wordmark visible inside the home hero. */
.hero-logo-card{aspect-ratio:.94;overflow:hidden}.hero-logo-card img{width:100%;height:100%;object-fit:contain}
@media(max-width:730px){.hero{min-height:465px}.hero-art{bottom:13px;right:11px;width:174px;height:188px}.hero-logo-card{width:165px;height:180px;border-radius:18px}.hero-copy{padding-bottom:145px}}

const load=(key,fallback)=>{try{const r=localStorage.getItem('finora_'+key);return r===null?(key in memoryStore?memoryStore[key]:fallback):JSON.parse(r)}catch{return key in memoryStore?memoryStore[key]:fallback}};
const save=(key,value)=>{memoryStore[key]=value;try{localStorage.setItem('finora_'+key,JSON.stringify(value))}catch{}};
const state={view:'home',category:'All',query:'',sort:'featured',cart:load('cart',{}),faves:load('faves',[]),orders:load('orders',[]),profile:load('profile',{}),promo:load('promo',''),modal:null,orderJustPlaced:null,session:load('session',null)};
const authUI={open:!load('welcomeSeen',false)&&!load('session',null),mode:'welcome',feedback:''};
let firebaseSdk=null,firebaseInstance=null,firebaseInitPromise=null;
const money=n=>`${CONFIG.currency} ${Number(n).toLocaleString('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const findProduct=id=>PRODUCTS.find(x=>x.id===Number(id));
const count=()=>Object.values(state.cart).reduce((a,n)=>a+Number(n||0),0);
const subtotal=()=>PRODUCTS.reduce((a,p)=>a+p.price*(state.cart[p.id]||0),0);
const calc=()=>{const sub=subtotal(),discount=state.promo==='FINORA10'?Math.round(sub*.1*100)/100:0,delivery=sub===0||sub>=CONFIG.freeDeliveryAt?0:CONFIG.deliveryFee,vat=Math.round((sub-discount+delivery)*.05*100)/100;return{sub,discount,delivery,vat,total:Math.round((sub-discount+delivery+vat)*100)/100}};
const photo=(p)=>`https://images.unsplash.com/${p.image}?auto=format&fit=crop&w=650&q=80`;
function toast(message){const el=document.createElement('div');el.className='toast';el.innerHTML=`${icon('check',17)}<span>${esc(message)}</span>`;$('#toasts').append(el);setTimeout(()=>el.remove(),2700)}
function brand(){return `<button class="brand" data-action="view" data-view="home" aria-label="FINORA Home"><span class="brand-badge"><img src="${FINORA_ICON}" alt="FINORA company logo"></span><span><span class="brand-name">FINORA<span>.</span></span><small>GLOBAL SERVICES FZE</small></span></button>`}
function navButton(view,label,ic){return `<button data-action="view" data-view="${view}" class="${state.view===view?'active':''}">${icon(ic,20)}<span>${label}</span>${view==='cart'&&count()?`<i class="counter">${count()}</i>`:''}</button>`}
function header(){return `<div class="top-note">DISCOVER THE FINORA EXPERIENCE <b>✦</b> CURATED FOR YOU</div><header class="head">${brand()}<nav class="head-links">${[['home','Home'],['shop','Shop'],['favourites','Wishlist'],['orders','My orders']].map(([v,t])=>`<button data-action="view" data-view="${v}" class="${state.view===v?'active':''}">${t}</button>`).join('')}</nav><label class="head-search">${icon('search',18)}<input id="desktopSearch" value="${esc(state.query)}" autocomplete="off" placeholder="Search FINORA products…" aria-label="Search products"></label><div class="head-icons"><button class="icon-btn" data-action="view" data-view="favourites" aria-label="Wishlist">${icon('heart',20)}</button><button class="icon-btn" data-action="cart" aria-label="Open cart">${icon('bag',20)}${count()?`<i class="counter">${count()}</i>`:''}</button></div></header>`}
function mobileNav(){return `<nav class="mobile-nav" aria-label="Main navigation">${navButton('home','Home','home')}${navButton('shop','Shop','grid')}${navButton('favourites','Saved','heart')}${navButton('cart','Cart','bag')}${navButton('account','Account','user')}</nav>`}
function sectionTitle(title,subtitle,more){return `<div class="section-heading"><div><h2>${title}</h2><p>${subtitle}</p></div>${more?`<button data-action="view" data-view="shop" class="text-link">View all ${icon('arrow',15)}</button>`:''}</div>`}
function home(){return `<section class="hero"><div class="hero-copy"><span class="eyebrow"><i></i> WELCOME TO FINORA GLOBAL SERVICES</span><h1>Better finds.<br><em>Better days.</em></h1><p>Discover everyday essentials, smart tech and more — all thoughtfully curated in one beautiful place.</p><div class="hero-cta"><button class="btn btn-lime" data-action="view" data-view="shop">Explore collection ${icon('arrow',17)}</button><button class="btn btn-ghost" data-action="view" data-view="favourites">My wishlist ${icon('heart',15)}</button></div></div><div class="hero-art"><div class="hero-logo-card"><img src="${FINORA_LOGO}" alt="FINORA Global Services official company logo"></div><div class="floating-chip chip1">✦ FINORA picks</div><div class="floating-chip chip2">✓ Curated finds</div></div></section>${sectionTitle('Browse categories','Find exactly what you love',false)}${categoryCards()}${sectionTitle('Picked for you','Popular finds worth adding to your bag',true)}${catalog(true)}<div class="promo-strip"><div><strong>Your next favourite is waiting.</strong><span>Use promo code FINORA10 for 10% off sample orders.</span></div><button class="promo-tag" data-action="copy-promo">FINORA10 ${icon('tag',13)}</button></div>${sectionTitle('More to explore','Fresh discoveries across every category',true)}<div class="products">${PRODUCTS.slice(8,12).map(productCard).join('')}</div>${trust()}`}
function categoryCards(){return `<div class="cats">${CATEGORIES.slice(1).map(([name,ic,desc])=>`<button class="cat ${state.category===name?'active':''}" data-action="category" data-category="${name}"><span class="cat-icon">${icon(ic,22)}</span><span><strong>${name}</strong><small>${desc}</small></span></button>`).join('')}</div>`}
function filtered(){let list=PRODUCTS.filter(p=>(state.category==='All'||p.category===state.category)&&(!state.query||(`${p.title} ${p.category} ${p.desc}`).toLowerCase().includes(state.query.toLowerCase())));if(state.view==='favourites')list=list.filter(p=>state.faves.includes(p.id));if(state.sort==='low')list.sort((a,b)=>a.price-b.price);if(state.sort==='high')list.sort((a,b)=>b.price-a.price);if(state.sort==='rated')list.sort((a,b)=>b.rating-a.rating);return list}
function catalog(compact=false){const products=compact?PRODUCTS.slice(0,8):filtered();return `<div id="catalog"><div class="catalog-tools"><div class="filter-row">${(compact?[]:CATEGORIES).map(([name])=>`<button class="filter-pill ${state.category===name?'active':''}" data-action="filter" data-category="${name}">${name}</button>`).join('')}</div>${compact?'':`<select class="sort" id="sort" aria-label="Sort products"><option value="featured" ${state.sort==='featured'?'selected':''}>Featured</option><option value="low" ${state.sort==='low'?'selected':''}>Price: low to high</option><option value="high" ${state.sort==='high'?'selected':''}>Price: high to low</option><option value="rated" ${state.sort==='rated'?'selected':''}>Highest rated</option></select>`}</div><div class="products">${products.map(productCard).join('')}</div>${!products.length?`<div class="empty"><div class="empty-icon">${icon('search',30)}</div><h3>No matching products</h3><p>Try another search or category.</p><button class="btn btn-primary" data-action="clear-filters">Clear filters</button></div>`:''}</div>`}

function cartControl(id){const n=Number(state.cart[id]||0);return `<span class="cart-control" data-product-id="${id}">${n?`<span class="mini-stepper"><button type="button" data-action="qty" data-id="${id}" data-delta="-1" aria-label="Remove one">${icon('minus',15)}</button><strong aria-live="polite">${n}</strong><button type="button" data-action="qty" data-id="${id}" data-delta="1" aria-label="Add one">${icon('plus',15)}</button></span>`:`<button type="button" class="add" data-action="add" data-id="${id}" aria-label="Add item to cart">${icon('plus',19)}</button>`}</span>`}
function refreshCartControls(id,animate=true){document.querySelectorAll(`.cart-control[data-product-id="${Number(id)}"]`).forEach(el=>{const next=document.createElement('span');next.innerHTML=cartControl(id);const inner=next.firstElementChild;el.replaceWith(inner);if(animate){inner.classList.add('pop');setTimeout(()=>inner.classList.remove('pop'),450)}});document.querySelectorAll('.head-icons [data-action="cart"],.mobile-nav [data-view="cart"]').forEach(btn=>{btn.querySelector('.counter')?.remove();if(count())btn.insertAdjacentHTML('beforeend',`<i class="counter">${count()}</i>`)})}
function changeQty(id,delta,origin){id=Number(id);if(!findProduct(id))return;const before=Number(state.cart[id]||0);const next=Math.max(0,before+Number(delta));if(next)state.cart[id]=next;else delete state.cart[id];persist();refreshCartControls(id,true);if(state.modal&&state.modal.type==='cart')updateModal();if(state.modal&&state.modal.type==='checkout')updateModal();if(before===0&&next>0)toast('Added to your bag');if(before>0&&next===0)toast('Removed from bag')}

function productCard(p){return `<article class="product"><div class="product-image" data-action="detail" data-id="${p.id}" role="button" tabindex="0" aria-label="View ${esc(p.title)}"><img loading="lazy" src="${photo(p)}" alt="${esc(p.title)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="backup-emoji" style="display:none">${p.emoji}</span><span class="product-tag">${p.tag}</span><button class="wish ${state.faves.includes(p.id)?'active':''}" data-action="wishlist" data-id="${p.id}" aria-label="Toggle wishlist for ${esc(p.title)}">${icon('heart',17)}</button></div><div class="product-body"><span class="product-category">${p.category}</span><div class="product-title" data-action="detail" data-id="${p.id}" role="button" tabindex="0">${esc(p.title)}</div><div class="product-meta"><span><b>★</b> ${p.rating.toFixed(1)} · Popular choice</span></div><div class="product-bottom"><div><div class="price"><small>AED</small> ${p.price.toLocaleString()}</div><span class="old">AED ${p.old.toLocaleString()}</span></div>${cartControl(p.id)}</div></div></article>`}
function trust(){return `<div class="trust">${[['truck','Delivery across UAE','Delivery options available at checkout'],['shield','Simple shopping experience','Real online payments require a gateway'],['package','Carefully chosen products','Designed for everyday shopping']].map(([ic,h,p])=>`<div class="trust-item"><div class="trust-icon">${icon(ic,22)}</div><div><strong>${h}</strong><small>${p}</small></div></div>`).join('')}</div>`}
function shop(){return `<div class="page-intro"><h1>Discover more.</h1><p>Explore the collection, or search for your next favourite.</p></div><label class="head-search" style="display:flex;margin:0 0 16px;width:100%">${icon('search',17)}<input id="mobileSearch" placeholder="Search products..." value="${esc(state.query)}" aria-label="Search products"></label>${catalog()}${trust()}`}
function favourites(){return `<div class="page-intro"><h1>Your wishlist.</h1><p>All your favourite FINORA discoveries, in one place.</p></div>${state.faves.length?`<div class="products">${PRODUCTS.filter(p=>state.faves.includes(p.id)).map(productCard).join('')}</div>`:empty('heart','Nothing saved yet','Tap the heart on any product to save it for later.','Browse products')}${trust()}`}
function empty(ic,title,desc,action){return `<div class="empty"><div class="empty-icon">${icon(ic,31)}</div><h3>${title}</h3><p>${desc}</p><button class="btn btn-primary" data-action="view" data-view="shop">${action} ${icon('arrow',17)}</button></div>`}
function orders(){return `<div class="page-intro"><h1>My orders.</h1><p>Orders placed on this device appear here.</p></div>${state.orders.length?state.orders.map(o=>`<div class="order-card"><div class="order-top"><div><h3>${esc(o.id)}</h3><small>${new Date(o.createdAt).toLocaleString('en-AE')}</small></div><span class="order-status">${o.sent?'WhatsApp handoff':'Saved on device'}</span></div><div class="order-products">${o.items.map(i=>`${esc(i.title)} × ${i.qty}`).join(' · ')}</div><div style="display:flex;justify-content:space-between;align-items:center"><strong>${money(o.total)}</strong><button class="btn btn-soft" data-action="receipt" data-id="${esc(o.id)}">Details ${icon('chevron',14)}</button></div></div>`).join(''):empty('package','No orders yet','When you place an order, you can find its details here.','Start shopping')}`}
function account(){return `<div class="page-intro"><h1>Your FINORA.</h1><p>${state.session?`Signed in as ${esc(state.session.email)}`:'Browse as a guest, or sign in to your account.'}</p></div><div class="profile-grid"><button class="tile" data-action="${state.session?'signout':'show-auth'}"><span><strong>${state.session?`Hi, ${esc(state.session.name||'FINORA member')} 👋`:'Sign in / Create account'}</strong><small>${state.session?'Tap to sign out':'Email, Google, Apple or Microsoft'}</small></span>${icon('chevron')}</button><button class="tile" data-action="edit-profile"><span><strong>Your delivery details</strong><small>Set up your name and phone number</small></span>${icon('chevron')}</button><button class="tile" data-action="view" data-view="orders"><span><strong>Order history</strong><small>${state.orders.length} locally saved order(s)</small></span>${icon('chevron')}</button><button class="tile" data-action="view" data-view="favourites"><span><strong>My wishlist</strong><small>${state.faves.length} saved item(s)</small></span>${icon('chevron')}</button><button class="tile" data-action="about"><span><strong>About FINORA</strong><small>Accounting, trading and more</small></span>${icon('chevron')}</button><button class="tile" data-action="download-app"><span><strong>Download Android app</strong><small>${CONFIG.androidApkUrl?'Open official download link':'Add your published APK link in settings'}</small></span>${icon('chevron')}</button></div><div class="promo-strip"><div><strong>Need help with an order?</strong><span>${CONFIG.whatsappNumber?'Contact us directly on WhatsApp.':'Add your business WhatsApp number in the file settings to enable chat.'}</span></div><button class="btn btn-primary" data-action="contact" ${!CONFIG.whatsappNumber?'disabled':''}>Contact ${icon('message-circle',15)}</button></div>`}
function footer(){return `<footer><div class="wrap footer-inner"><div><div class="footer-name">FINORA<span>.</span></div><p>FINORA GLOBAL SERVICES FZE · UAE</p><p>Demo catalogue — verify prices and stock before publishing.</p></div><div class="footer-links"><button data-action="view" data-view="shop">Shop</button><button data-action="view" data-view="orders">My orders</button><button data-action="about">About</button><button data-action="contact">Contact</button></div></div></footer>`}
function render(){const page=state.view==='home'?home():state.view==='shop'?shop():state.view==='favourites'?favourites():state.view==='orders'?orders():account();$('#app').innerHTML=header()+`<main class="wrap">${page}</main>`+footer()+mobileNav()}
function navigate(view){if(view==='cart'){openModal('cart');return}state.view=view;state.category='All';state.query='';state.sort='featured';render();window.scrollTo({top:0,behavior:'smooth'})}
function modalFrame(title,body,foot='',wide=false){return `<div class="overlay" data-action="dismiss"><div class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialog-head"><h2>${esc(title)}</h2><button class="close" data-action="close" aria-label="Close">${icon('x',19)}</button></div><div class="dialog-body">${body}</div>${foot?`<div class="dialog-foot">${foot}</div>`:''}</div></div>`}
function updateModal(){document.body.classList.toggle('lock',!!state.modal);if(!state.modal){$('#modalRoot').innerHTML='';return}const m=state.modal;let html='';if(m.type==='cart')html=cartModal();if(m.type==='checkout')html=checkoutModal();if(m.type==='detail')html=detailModal(m.id);if(m.type==='success')html=successModal();if(m.type==='profile')html=profileModal();if(m.type==='receipt')html=receiptModal(m.id);if(m.type==='about')html=aboutModal();$('#modalRoot').innerHTML=html}
function openModal(type,id){state.modal={type,id};updateModal()}
function closeModal(){state.modal=null;state.orderJustPlaced=null;updateModal()}
function cartRows(){return PRODUCTS.filter(p=>state.cart[p.id]>0).map(p=>`<div class="cart-line"><div class="cart-img"><img loading="eager" src="${photo(p)}" alt="${esc(p.title)}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="fallback-thumb" hidden aria-label="${esc(p.title)} image placeholder">${p.emoji}</div></div><div class="cart-detail"><strong>${esc(p.title)}</strong><small>${p.category}</small>${cartControl(p.id)}</div><div class="cart-price"><strong>${money(p.price*state.cart[p.id])}</strong><button class="remove" data-action="remove" data-id="${p.id}" aria-label="Remove ${esc(p.title)}">${icon('trash',17)}</button></div></div>`).join('')}
function summary(){const c=calc();return `<div class="summary"><div class="sum-line"><span>Subtotal</span><b>${money(c.sub)}</b></div>${c.discount?`<div class="sum-line"><span>Promo saving</span><b style="color:#119e83">-${money(c.discount)}</b></div>`:''}<div class="sum-line"><span>Delivery</span><b>${c.delivery?money(c.delivery):'FREE'}</b></div><div class="sum-line"><span>Estimated VAT (5%)</span><b>${money(c.vat)}</b></div><div class="sum-line total"><span>Estimated total</span><span>${money(c.total)}</span></div><div class="form-note">Sample prices and tax estimate. Final VAT treatment must be confirmed for your actual products.</div></div>`}
function cartModal(){if(!count())return modalFrame('My bag',`<div class="success"><div class="empty-icon" style="width:75px;height:75px;display:grid;place-items:center;border-radius:22px;background:#eaf7f3;color:#0ba58d">${icon('bag',34)}</div><h2>Your bag feels empty</h2><p>There are amazing things to discover.</p><button class="btn btn-primary" data-action="close">Continue shopping ${icon('arrow',16)}</button></div>`);const c=calc();return modalFrame(`My bag (${count()})`,`${cartRows()}<div class="promo-form"><input class="field" id="promoInput" placeholder="Promo code" value="${esc(state.promo)}" maxlength="20" aria-label="Promo code"><button class="btn btn-soft" data-action="promo">Apply</button></div>${c.sub<CONFIG.freeDeliveryAt?`<div class="form-note">Add ${money(CONFIG.freeDeliveryAt-c.sub)} more for free delivery.</div>`:`<div class="form-note" style="color:#0ba486">✓ Free delivery unlocked</div>`}${summary()}`,`<button class="btn btn-primary btn-wide" data-action="checkout">Checkout · ${money(c.total)} ${icon('arrow',17)}</button>`)}
function checkoutModal(){if(!count())return cartModal();return modalFrame('Checkout',`<form id="checkoutForm"><div class="checkout-section"><h3>01 · Contact & delivery</h3><div class="form-grid"><div class="form-group"><label for="buyerName">Full name *</label><input class="field" id="buyerName" name="name" required maxlength="80" autocomplete="name" value="${esc(state.profile.name||'')}" placeholder="Your full name"></div><div class="form-group"><label for="buyerPhone">Mobile number *</label><input class="field" id="buyerPhone" name="phone" required maxlength="18" inputmode="tel" autocomplete="tel" pattern="[+0-9 ()-]{7,18}" value="${esc(state.profile.phone||'')}" placeholder="+971 5X XXX XXXX"></div></div><div class="form-group"><label for="buyerAddress">Delivery address *</label><textarea class="field" id="buyerAddress" name="address" rows="3" required maxlength="300" placeholder="Building, street, area, emirate">${esc(state.profile.address||'')}</textarea></div><div class="form-group"><label for="buyerNotes">Delivery notes (optional)</label><input class="field" id="buyerNotes" name="notes" maxlength="180" placeholder="Apartment, landmark, instructions"></div></div><div class="checkout-section"><h3>02 · Payment method</h3><label class="pay-option"><input type="radio" name="payment" value="COD" checked><span>${icon('truck',22)}</span><span><strong>Cash on delivery</strong><small>Pay when your order is delivered</small></span></label><div class="pay-option pay-disabled"><span>${icon('credit-card',22)}</span><span><strong>Card / Apple Pay — not connected</strong><small>Requires a real, approved payment gateway</small></span></div><p class="form-note">${CONFIG.whatsappNumber?'After placing your order, WhatsApp opens with the order details. You must press Send to deliver it to FINORA.':'Demo mode: order details are saved on this browser only. Set CONFIG.whatsappNumber to send COD orders to the business via WhatsApp.'}</p></div>${summary()}</form>`,`<button class="btn btn-primary btn-wide" type="submit" form="checkoutForm">Place cash-on-delivery order ${icon('arrow',16)}</button>`)}
function detailModal(id){const p=findProduct(id);if(!p)return '';return modalFrame('Product details',`<div class="detail-image"><img src="${photo(p)}" alt="${esc(p.title)}" onerror="this.hidden=true;this.insertAdjacentHTML('afterend','<div class=&quot;fallback-thumb&quot; style=&quot;font-size:90px&quot;>${p.emoji}</div>')"></div><span class="product-category">${p.category}</span><h2 class="detail-title">${esc(p.title)}</h2><div class="product-meta"><span>⭐ ${p.rating.toFixed(1)} · Curated choice</span></div><p class="detail-desc">${esc(p.desc)} Sample listing for the FINORA app demonstration.</p><div class="detail-perks"><span>${icon('truck',16)} UAE delivery</span><span>${icon('shield',16)} Local order support</span></div><div style="display:flex;align-items:center;justify-content:space-between;margin:15px 0"><div><div class="price">${money(p.price)}</div><span class="old">${money(p.old)}</span></div><button class="btn btn-soft" data-action="wishlist" data-id="${p.id}">${icon('heart',17)} ${state.faves.includes(p.id)?'Saved':'Save'}</button></div>`,`${cartControl(p.id)}`,true)}
function successModal(){const o=state.orderJustPlaced;if(!o)return '';return modalFrame('Order placed',`<div class="success"><div class="success-icon">${icon('check',42)}</div><h2>${o.sent?'Order details prepared!':'Order saved on device!'}</h2><p>${o.sent?'WhatsApp has been opened with your order details. Please press Send in WhatsApp to submit your request to FINORA.':'This is a local demo order, not yet received by FINORA. Connect your WhatsApp business number to submit COD orders.'}</p><div class="code">${esc(o.id)}</div><p>Total: <b>${money(o.total)}</b></p><button class="btn btn-primary btn-wide" data-action="view" data-view="orders">View my orders ${icon('arrow',17)}</button>${o.sent?`<button class="btn btn-soft btn-wide" style="margin-top:10px" data-action="send-order" data-id="${esc(o.id)}">Open WhatsApp again ${icon('message-circle',17)}</button>`:''}</div>`)}
function profileModal(){return modalFrame('My details',`<form id="profileForm"><div class="form-group"><label>Name</label><input class="field" name="name" value="${esc(state.profile.name||'')}" maxlength="80" placeholder="Your name" required></div><div class="form-group"><label>Mobile number</label><input class="field" name="phone" value="${esc(state.profile.phone||'')}" maxlength="18" inputmode="tel" placeholder="+971 ..."></div><div class="form-group"><label>Default delivery address</label><textarea class="field" name="address" rows="3" maxlength="300">${esc(state.profile.address||'')}</textarea></div><p class="form-note">These details stay in this browser; do not use on a shared device.</p></form>`,`<button class="btn btn-primary btn-wide" type="submit" form="profileForm">Save details ${icon('check',16)}</button>`)}
function receiptModal(id){const o=state.orders.find(x=>x.id===id);if(!o)return '';return modalFrame('Order details',`<h3>${esc(o.id)}</h3><p class="form-note">${new Date(o.createdAt).toLocaleString('en-AE')}</p><div style="margin:18px 0">${o.items.map(i=>{const p=findProduct(i.id);return `<div class="cart-line"><div class="cart-img"><img src="${p?photo(p):''}" alt="${esc(i.title)}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="fallback-thumb" hidden>${p?.emoji||'📦'}</div></div><div class="cart-detail"><strong>${esc(i.title)}</strong><small>Qty ${i.qty}</small></div><b>${money(i.lineTotal)}</b></div>`}).join('')}</div><hr style="border:0;border-top:1px solid var(--line)"><p><strong>Customer:</strong> ${esc(o.customer.name)}</p><p><strong>Phone:</strong> ${esc(o.customer.phone)}</p><p><strong>Address:</strong> ${esc(o.customer.address)}</p><p><strong>Payment:</strong> Cash on delivery</p><p><strong>Total:</strong> ${money(o.total)}</p><p class="form-note">${o.sent?'WhatsApp order handoff prepared; customer must press Send.':'Locally saved demo order only.'}</p>`,`${CONFIG.whatsappNumber?`<button class="btn btn-soft btn-wide" data-action="send-order" data-id="${esc(o.id)}">Send order via WhatsApp ${icon('message-circle',17)}</button>`:''}`)}
function aboutModal(){return modalFrame('About FINORA',`<div style="margin:4px 0 24px">${brand()}</div><h2>Better services. Better shopping.</h2><p class="detail-desc">FINORA GLOBAL SERVICES FZE is presented here as a modern marketplace concept for electronics, groceries, home essentials, office products and lifestyle items, alongside its accounting and general trading services.</p><p class="detail-desc">This single-file demo features product discovery, wishlists, shopping cart, promotions, a cash-on-delivery order flow and locally saved order history.</p><div class="trust-item"><div class="trust-icon">${icon('shield')}</div><div><strong>Before going live</strong><small>Replace sample inventory, enter an order-receiving WhatsApp number, check delivery charges and taxes, and connect a certified payment gateway for card payments.</small></div></div>`)}
function persist(){save('cart',state.cart);save('faves',state.faves);save('orders',state.orders);save('profile',state.profile);save('promo',state.promo)}
function syncUI(){render();if(state.modal)updateModal()}
function add(id,button){changeQty(id,1,button)}
function toggleFavourite(id){id=Number(id);if(state.faves.includes(id))state.faves=state.faves.filter(x=>x!==id);else state.faves.push(id);persist();syncUI();toast(state.faves.includes(id)?'Added to wishlist':'Removed from wishlist')}
function orderMessage(o){return [`New FINORA COD Order: ${o.id}`,`Name: ${o.customer.name}`,`Phone: ${o.customer.phone}`,`Delivery: ${o.customer.address}`,o.customer.notes?`Notes: ${o.customer.notes}`:'','Items:',...o.items.map(i=>`- ${i.title} x${i.qty}: ${money(i.lineTotal)}`),`Total (estimate): ${money(o.total)}`,'Payment: Cash on delivery','Please confirm availability, pricing and delivery.'].filter(Boolean).join('\n')}
function openExternal(url){if(window.FinoraNative&&typeof window.FinoraNative.openUrl==='function'){window.FinoraNative.openUrl(url)}else{window.open(url,'_blank','noopener,noreferrer')}}
function whatsappLink(o){return `https://wa.me/${CONFIG.whatsappNumber.replace(/\D/g,'')}?text=${encodeURIComponent(orderMessage(o))}`}
function placeOrder(form){if(!form.reportValidity())return;const d=new FormData(form),customer={name:String(d.get('name')||'').trim(),phone:String(d.get('phone')||'').trim(),address:String(d.get('address')||'').trim(),notes:String(d.get('notes')||'').trim()};if(customer.name.length<2||customer.phone.replace(/\D/g,'').length<7||customer.address.length<8){toast('Please enter valid delivery details');return}const items=PRODUCTS.filter(p=>state.cart[p.id]>0).map(p=>({id:p.id,title:p.title,qty:state.cart[p.id],price:p.price,lineTotal:p.price*state.cart[p.id]}));if(!items.length)return;const totals=calc();const o={id:`FN-${Date.now().toString(36).toUpperCase()}`,createdAt:new Date().toISOString(),customer,items,total:totals.total,sub:totals.sub,delivery:totals.delivery,vat:totals.vat,discount:totals.discount,sent:!!CONFIG.whatsappNumber};state.orders.unshift(o);state.profile={name:customer.name,phone:customer.phone,address:customer.address};state.cart={};state.promo='';state.orderJustPlaced=o;persist();if(CONFIG.whatsappNumber)openExternal(whatsappLink(o));render();openModal('success')}
function copyPromo(){const code='FINORA10';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(code).catch(()=>{});toast('Use code FINORA10 in your cart')}
function applyPromo(){const field=$('#promoInput');const code=(field?.value||'').trim().toUpperCase();if(code==='FINORA10'){state.promo=code;persist();updateModal();toast('10% sample discount applied')}else if(!code){state.promo='';persist();updateModal();toast('Promo removed')}else{toast('Sorry, that code is not valid')}}
// All interactive buttons are handled here.
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='show-auth'){openAuth('welcome');return}if(a==='signout'){signOut();return}if(a==='download-app'){downloadApp();return}if(a==='dismiss'){if(e.target===b)closeModal();return}if(a==='close'){closeModal();return}if(a==='view'){closeModal();navigate(b.dataset.view);return}if(a==='cart'){openModal('cart');return}if(a==='add'){add(Number(id),b);return}if(a==='wishlist'){toggleFavourite(id);return}if(a==='detail'){openModal('detail',Number(id));return}if(a==='category'){state.category=b.dataset.category;state.view='shop';render();window.scrollTo({top:0,behavior:'smooth'});return}if(a==='filter'){state.category=b.dataset.category;render();return}if(a==='clear-filters'){state.category='All';state.query='';render();return}if(a==='qty'){changeQty(id,Number(b.dataset.delta),b);return}if(a==='remove'){delete state.cart[id];persist();syncUI();toast('Removed from bag');return}if(a==='promo'){applyPromo();return}if(a==='copy-promo'){copyPromo();return}if(a==='checkout'){openModal('checkout');return}if(a==='edit-profile'){openModal('profile');return}if(a==='receipt'){openModal('receipt',id);return}if(a==='about'){openModal('about');return}if(a==='contact'){if(CONFIG.whatsappNumber)openExternal(`https://wa.me/${CONFIG.whatsappNumber.replace(/\D/g,'')}`);else toast('Add the WhatsApp number in CONFIG first');return}if(a==='send-order'){const o=state.orders.find(o=>o.id===id);if(o&&CONFIG.whatsappNumber)openExternal(whatsappLink(o));return}});
document.addEventListener('input',e=>{if(!['desktopSearch','mobileSearch'].includes(e.target.id))return;state.query=e.target.value;state.category='All';if(state.view!=='shop'){state.view='shop';render();const target=$('#mobileSearch')||$('#desktopSearch');if(target){target.focus();target.setSelectionRange(target.value.length,target.value.length)}return}const cat=$('#catalog');if(cat)cat.outerHTML=catalog();const other=e.target.id==='desktopSearch'?$('#mobileSearch'):$('#desktopSearch');if(other)other.value=state.query});
document.addEventListener('change',e=>{if(e.target.id==='sort'){state.sort=e.target.value;const cat=$('#catalog');if(cat)cat.outerHTML=catalog()}});
document.addEventListener('submit',e=>{if(e.target.id==='checkoutForm'){e.preventDefault();placeOrder(e.target)}if(e.target.id==='profileForm'){e.preventDefault();const d=new FormData(e.target);state.profile={name:String(d.get('name')||'').trim(),phone:String(d.get('phone')||'').trim(),address:String(d.get('address')||'').trim()};persist();closeModal();render();toast('Details saved on this device')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-action="detail"]')){e.preventDefault();openModal('detail',Number(e.target.dataset.id))}});

/* AUTHENTICATION: Local demo accounts work only on this device. Firebase enables real web auth after setup.
   Social OAuth must be hosted on HTTPS and use approved browser/native SDK flows, not file:// Android WebView. */
function openAuth(mode='welcome'){authUI.open=true;authUI.mode=mode;authUI.feedback='';renderAuth()}
function closeAuth(){authUI.open=false;authUI.feedback='';save('welcomeSeen',true);renderAuth()}
function authFeedback(message){authUI.feedback=message;const el=$('#authFeedback');if(el){el.textContent=message;el.classList.remove('hidden')}else renderAuth()}
function providerButtons(){return `<div class="provider-grid"><button type="button" class="provider" data-auth="provider" data-provider="google"><span class="provider-icon provider-google">G</span>Google</button><button type="button" class="provider" data-auth="provider" data-provider="apple"><span class="provider-icon provider-apple">●</span>Apple</button><button type="button" class="provider" data-auth="provider" data-provider="microsoft"><span class="provider-icon provider-microsoft">▦</span>Microsoft</button></div>`}
function renderAuth(){document.body.classList.toggle('auth-open',authUI.open);const root=$('#authRoot');if(!authUI.open){root.innerHTML='';return}const m=authUI.mode;let body='';if(m==='welcome'){body=`<h2>Shop your way.</h2><p class="auth-sub">Discover FINORA products, save your favourites and enjoy a smoother checkout.</p><button class="auth-primary" data-auth="mode" data-mode="register">Create your account ${icon('arrow',17)}</button><button class="auth-secondary" data-auth="mode" data-mode="login">I already have an account</button><div class="auth-divider">or continue with</div>${providerButtons()}<button class="auth-guest" data-auth="guest">Continue as guest →</button><button class="auth-secondary" data-auth="download">${icon('download',17)} Download Android app</button>`}
else{const register=m==='register';body=`<h2>${register?'Create your FINORA account':'Welcome back.'}</h2><p class="auth-sub">${register?'Start shopping with a FINORA account.':'Sign in to continue your FINORA experience.'}</p><form id="authForm" data-mode="${m}">${register?`<div class="auth-field"><label for="authName">Full name</label><input id="authName" name="name" autocomplete="name" maxlength="70" placeholder="Your name" required></div>`:''}<div class="auth-field"><label for="authEmail">Email address</label><input id="authEmail" name="email" type="email" autocomplete="email" maxlength="130" placeholder="you@example.com" required></div><div class="auth-field"><label for="authPassword">Password</label><input id="authPassword" name="password" type="password" autocomplete="${register?'new-password':'current-password'}" minlength="6" maxlength="128" placeholder="At least 6 characters" required></div>${register?`<p class="auth-notice">Demo mode: accounts stay on this device only. Don't use a password you use elsewhere. To enable secure, cross-device accounts, configure Firebase Authentication.</p>`:''}<button class="auth-primary" type="submit">${register?'Create account':'Sign in'} ${icon('arrow',17)}</button></form><div class="auth-footer">${register?'Already registered?':'New to FINORA?'} <button data-auth="mode" data-mode="${register?'login':'register'}">${register?'Sign in':'Create account'}</button></div><div class="auth-divider">or sign in with</div>${providerButtons()}<button class="auth-guest" data-auth="guest">Continue as guest →</button>`}
root.innerHTML=`<section class="auth-shell" aria-label="FINORA sign in"><div class="auth-layout"><div class="auth-side"><img class="auth-logo" src="${FINORA_LOGO}" alt="FINORA Global Services company logo"><div><h1>FINORA<br>Global Services</h1><p>Everything you need, beautifully brought together. Shop electronics, groceries, home and office essentials.</p><small>FINORA GLOBAL SERVICES FZE · UAE</small></div></div><div class="auth-panel"><div class="auth-top"><span class="auth-kicker">YOUR FINORA EXPERIENCE</span><button class="auth-close" data-auth="guest">Skip for now ✕</button></div>${body}<div id="authFeedback" class="auth-feedback ${authUI.feedback?'':'hidden'}" role="status">${esc(authUI.feedback)}</div><div class="auth-footer"><span class="auth-badge">${icon('shield',13)} Demo catalogue · UAE</span></div></div></div></section>`}
function demoHash(str){/* Device-only prototype hash; not suitable for production password security. */let h=2166136261;for(let round=0;round<12;round++)for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function completeAuth(session){state.session=session;save('session',session);save('welcomeSeen',true);authUI.open=false;renderAuth();render();toast(`Welcome, ${session.name||'FINORA member'}!`)}
async function firebaseModules(){if(firebaseInitPromise)return firebaseInitPromise;const cfg=AUTH_CONFIG.firebase;if(!cfg.apiKey||!cfg.authDomain||!cfg.projectId||!cfg.appId)throw Error('Social sign-in is not configured yet. Add your Firebase project details and enable this provider in Firebase Authentication.');firebaseInitPromise=(async()=>{const [app,auth]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js')]);firebaseSdk=auth;firebaseInstance=auth.getAuth(app.initializeApp(cfg));auth.onAuthStateChanged(firebaseInstance,u=>{if(u){completeAuth({name:u.displayName||u.email?.split('@')[0]||'FINORA member',email:u.email||'',method:'firebase'})}});return auth})().catch(e=>{firebaseInitPromise=null;throw e});return firebaseInitPromise}
async function authProvider(provider){if(location.protocol==='file:'){authFeedback(`${provider[0].toUpperCase()+provider.slice(1)} sign-in needs a hosted HTTPS site or native Android sign-in integration. Google, Apple and Microsoft block OAuth inside basic file-based Android WebViews.`);return}try{const auth=await firebaseModules();let p;if(provider==='google')p=new auth.GoogleAuthProvider();else if(provider==='apple')p=new auth.OAuthProvider('apple.com');else p=new auth.OAuthProvider('microsoft.com');const r=await auth.signInWithPopup(firebaseInstance,p);completeAuth({name:r.user.displayName||r.user.email?.split('@')[0]||'FINORA member',email:r.user.email||'',method:'firebase'})}catch(e){authFeedback(`Couldn't sign in: ${e.message||'Please check provider setup.'}`)}}
async function authEmail(form){if(!form.reportValidity())return;const d=new FormData(form);const mode=form.dataset.mode;const name=String(d.get('name')||'').trim(),email=String(d.get('email')||'').trim().toLowerCase(),password=String(d.get('password')||'');if(password.length<6){authFeedback('Password must be at least 6 characters.');return}if(AUTH_CONFIG.firebase.apiKey){try{const a=await firebaseModules();if(mode==='register'){const r=await a.createUserWithEmailAndPassword(firebaseInstance,email,password);await a.updateProfile(r.user,{displayName:name});completeAuth({name,email,method:'firebase'})}else{const r=await a.signInWithEmailAndPassword(firebaseInstance,email,password);completeAuth({name:r.user.displayName||email.split('@')[0],email,method:'firebase'})}}catch(e){authFeedback(`Sign-in failed: ${e.message||'Check your details.'}`)}return}
const users=load('demoUsers',[]);if(mode==='register'){if(name.length<2){authFeedback('Please enter your full name.');return}if(users.some(u=>u.email===email)){authFeedback('This email already has a demo account on this device. Please sign in.');return}const salt=Math.random().toString(36).slice(2);users.push({name,email,salt,hash:demoHash(salt+password)});save('demoUsers',users);completeAuth({name,email,method:'local-demo'})}else{const u=users.find(u=>u.email===email);if(!u||u.hash!==demoHash(u.salt+password)){authFeedback('Email or password is incorrect for this device-only demo account.');return}completeAuth({name:u.name,email,method:'local-demo'})}}
async function signOut(){if(state.session?.method==='firebase'&&firebaseInstance&&firebaseSdk){try{await firebaseSdk.signOut(firebaseInstance)}catch{}}state.session=null;save('session',null);openAuth('welcome');render()}
function downloadApp(){if(CONFIG.androidApkUrl){openExternal(CONFIG.androidApkUrl);return}const msg='The Android download link is not published yet. Upload your built APK to a GitHub Release or your website, then paste its HTTPS URL into CONFIG.androidApkUrl.';if(authUI.open)authFeedback(msg);else toast(msg)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-auth]');if(!b)return;const a=b.dataset.auth;if(a==='mode'){authUI.mode=b.dataset.mode;authUI.feedback='';renderAuth()}else if(a==='guest')closeAuth();else if(a==='provider')authProvider(b.dataset.provider);else if(a==='download')downloadApp()});
document.addEventListener('submit',e=>{if(e.target.id==='authForm'){e.preventDefault();authEmail(e.target)}});


render();
renderAuth();
</script>
</body>
</html>
