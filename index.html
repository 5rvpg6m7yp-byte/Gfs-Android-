const PATH={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',bag:'<path d="M5 8h14l-1 13H6L5 8z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',check:'<path d="m4 12 5 5L20 6"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',arrow:'<path d="M5 12h14m-7-7 7 7-7 7"/>',chevron:'<path d="m9 18 6-6-6-6"/>',trash:'<path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>','grid-2x2':'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',smartphone:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>','shopping-basket':'<path d="m3 10 3 11h12l3-11H3zm4-2 5-6 5 6M2 10h20M9 14v3m6-3v3"/>',house:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/>','briefcase-business':'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>',sparkles:'<path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3zm7 12 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/>',truck:'<path d="M2 6h12v12H2zM14 10h4l4 4v4h-8z"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',package:'<path d="m3 7 9-4 9 4v10l-9 4-9-4V7zM3 7l9 4 9-4m-9 4v10"/>',star:'<path d="m12 2 3 6 7 .9-5 4.9 1.2 7-6.2-3.2L5.8 21 7 14 2 9l7-.9z"/>',tag:' const icon=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATH[n]||PATH.package}</svg>`;
const $=(q,el=document)=>el.querySelector(q);
const load=(key,fallback)=>{try{const r=localStorage.getItem('finora_'+key);return r===null?fallback:JSON.parse(r)}catch{return fallback}};
const save=(key,value)=>{try{localStorage.setItem('finora_'+key,JSON.stringify(value))}catch{}};
const state={view:'home',category:'All',query:'',sort:'featured',cart:load('cart',{}),faves:load('faves',[]),orders:load('orders',[]),profile:load('profile',{}),promo:load('promo',''),modal:null,orderJustPlaced:null};
const money=n=>`${CONFIG.currency} ${Number(n).toLocaleString('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const findProduct=id=>PRODUCTS.find(x=>x.id===Number(id));
const count=()=>Object.values(state.cart).reduce((a,n)=>a+Number(n||0),0);
const subtotal=()=>PRODUCTS.reduce((a,p)=>a+p.price*(state.cart[p.id]||0),0);
const calc=()=>{const sub=subtotal(),discount=state.promo==='FINORA10'?Math.round(sub*.1*100)/100:0,delivery=sub===0||sub>=CONFIG.freeDeliveryAt?0:CONFIG.deliveryFee,vat=Math.round((sub-discount+delivery)*.05*100)/100;return{sub,discount,delivery,vat,total:Math.round((sub-discount+delivery+vat)*100)/100}};
const photo=(p)=>`https://images.unsplash.com/${p.image}?auto=format&fit=crop&w=650&q=80`;
function toast(message){const el=document.createElement('div');el.className='toast';el.innerHTML=`${icon('check',17)}<span>${esc(message)}</span>`;$('#toasts').append(el);setTimeout(()=>el.remove(),2700)}
function brand(){return `<button class="brand" data-action="view" data-view="home" aria-label="FINORA Home"><span class="brand-badge"><span>F</span></span><span><span class="brand-name">FINORA<span>.</span></span><small>GLOBAL SERVICES FZE</small></span></button>`}
function navButton(view,label,ic){return `<button data-action="view" data-view="${view}" class="${state.view===view?'active':''}">${icon(ic,20)}<span>${label}</span>${view==='cart'&&count()?`<i class="counter">${count()}</i>`:''}</button>`}
function header(){return `<div class="top-note">DISCOVER THE FINORA EXPERIENCE <b>✦</b> CURATED FOR YOU</div><header class="head">${brand()}<nav class="head-links">${[['home','Home'],['shop','Shop'],['favourites','Wishlist'],['orders','My orders']].map(([v,t])=>`<button data-action="view" data-view="${v}" class="${state.view===v?'active':''}">${t}</button>`).join('')}</nav><label class="head-search">${icon('search',18)}<input id="desktopSearch" value="${esc(state.query)}" autocomplete="off" placeholder="Search FINORA products…" aria-label="Search products"></label><div class="head-icons"><button class="icon-btn" data-action="view" data-view="favourites" aria-label="Wishlist">${icon('heart',20)}</button><button class="icon-btn" data-action="cart" aria-label="Open cart">${icon('bag',20)}${count()?`<i class="counter">${count()}</i>`:''}</button></div></header>`}
function mobileNav(){return `<nav class="mobile-nav" aria-label="Main navigation">${navButton('home','Home','home')}${navButton('shop','Shop','grid')}${navButton('favourites','Saved','heart')}${navButton('cart','Cart','bag')}${navButton('account','Account','user')}</nav>`}
function sectionTitle(title,subtitle,more){return `<div class="section-heading"><div><h2>${title}</h2><p>${subtitle}</p></div>${more?`<button data-action="view" data-view="shop" class="text-link">View all ${icon('arrow',15)}</button>`:''}</div>`}
function home(){return `<section class="hero"><div class="hero-copy"><span class="eyebrow"><i></i> WELCOME TO THE FINORA EDIT</span><h1>Better finds.<br><em>Better days.</em></h1><p>Discover everyday essentials, smart tech and more — all thoughtfully curated in one beautiful place.</p><div class="hero-cta"><button class="btn btn-lime" data-action="view" data-view="shop">Explore collection ${icon('arrow',17)}</button><button class="btn btn-ghost" data-action="view" data-view="favourites">My wishlist ${icon('heart',15)}</button></div></div><div class="hero-art"><div class="orb"><div class="orb-inner">F</div></div><div class="floating-chip chip1">✦ The good stuff</div><div class="floating-chip chip2">✓ Curated finds</div></div></section>${sectionTitle('Browse categories','Find exactly what you love',false)}${categoryCards()}${sectionTitle('Picked for you','Popular finds worth adding to your bag',true)}${catalog(true)}<div class="promo-strip"><div><strong>Your next favourite is waiting.</strong><span>Use promo code FINORA10 for 10% off sample orders.</span></div><button class="promo-tag" data-action="copy-promo">FINORA10 ${icon('tag',13)}</button></div>${sectionTitle('More to explore','Fresh discoveries across every category',true)}<div class="products">${PRODUCTS.slice(8,12).map(productCard).join('')}</div>${trust()}`}
function categoryCards(){return `<div class="cats">${CATEGORIES.slice(1).map(([name,ic,desc])=>`<button class="cat ${state.category===name?'active':''}" data-action="category" data-category="${name}"><span class="cat-icon">${icon(ic,22)}</span><span><strong>${name}</strong><small>${desc}</small></span></button>`).join('')}</div>`}
function filtered(){let list=PRODUCTS.filter(p=>(state.category==='All'||p.category===state.category)&&(!state.query||(`${p.title} ${p.category} ${p.desc}`).toLowerCase().includes(state.query.toLowerCase())));if(state.view==='favourites')list=list.filter(p=>state.faves.includes(p.id));if(state.sort==='low')list.sort((a,b)=>a.price-b.price);if(state.sort==='high')list.sort((a,b)=>b.price-a.price);if(state.sort==='rated')list.sort((a,b)=>b.rating-a.rating);return list}
function catalog(compact=false){const products=compact?PRODUCTS.slice(0,8):filtered();return `<div id="catalog"><div class="catalog-tools"><div class="filter-row">${(compact?[]:CATEGORIES).map(([name])=>`<button class="filter-pill ${state.category===name?'active':''}" data-action="filter" data-category="${name}">${name}</button>`).join('')}</div>${compact?'':`<select class="sort" id="sort" aria-label="Sort products"><option value="featured" ${state.sort==='featured'?'selected':''}>Featured</option><option value="low" ${state.sort==='low'?'selected':''}>Price: low to high</option><option value="high" ${state.sort==='high'?'selected':''}>Price: high to low</option><option value="rated" ${state.sort==='rated'?'selected':''}>Highest rated</option></select>`}</div><div class="products">${products.map(productCard).join('')}</div>${!products.length?`<div class="empty"><div class="empty-icon">${icon('search',30)}</div><h3>No matching products</h3><p>Try another search or category.</p><button class="btn btn-primary" data-action="clear-filters">Clear filters</button></div>`:''}</div>`}
function productCard(p){return `<article class="product"><div class="product-image" data-action="detail" data-id="${p.id}" role="button" tabindex="0" aria-label="View ${esc(p.title)}"><img loading="lazy" src="${photo(p)}" alt="${esc(p.title)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="backup-emoji" style="display:none">${p.emoji}</span><span class="product-tag">${p.tag}</span><button class="wish ${state.faves.includes(p.id)?'active':''}" data-action="wishlist" data-id="${p.id}" aria-label="Toggle wishlist for ${esc(p.title)}">${icon('heart',17)}</button></div><div class="product-body"><span class="product-category">${p.category}</span><div class="product-title" data-action="detail" data-id="${p.id}" role="button" tabindex="0">${esc(p.title)}</div><div class="product-meta"><span><b>★</b> ${p.rating.toFixed(1)} · Popular choice</span></div><div class="product-bottom"><div><div class="price"><small>AED</small> ${p.price.toLocaleString()}</div><span class="old">AED ${p.old.toLocaleString()}</span></div><button class="add" data-action="add" data-id="${p.id}" aria-label="Add ${esc(p.title)} to cart">${icon('plus',20)}</button></div></div></article>`}
function trust(){return `<div class="trust">${[['truck','Delivery across UAE','Delivery options available at checkout'],['shield','Simple shopping experience','Real online payments require a gateway'],['package','Carefully chosen products','Designed for everyday shopping']].map(([ic,h,p])=>`<div class="trust-item"><div class="trust-icon">${icon(ic,22)}</div><div><strong>${h}</strong><small>${p}</small></div></div>`).join('')}</div>`}
function shop(){return `<div class="page-intro"><h1>Discover more.</h1><p>Explore the collection, or search for your next favourite.</p></div><label class="head-search" style="display:flex;margin:0 0 16px;width:100%">${icon('search',17)}<input id="mobileSearch" placeholder="Search products..." value="${esc(state.query)}" aria-label="Search products"></label>${catalog()}${trust()}`}
function favourites(){return `<div class="page-intro"><h1>Your wishlist.</h1><p>All your favourite FINORA discoveries, in one place.</p></div>${state.faves.length?`<div class="products">${PRODUCTS.filter(p=>state.faves.includes(p.id)).map(productCard).join('')}</div>`:empty('heart','Nothing saved yet','Tap the heart on any product to save it for later.','Browse products')}${trust()}`}
function empty(ic,title,desc,action){return `<div class="empty"><div class="empty-icon">${icon(ic,31)}</div><h3>${title}</h3><p>${desc}</p><button class="btn btn-primary" data-action="view" data-view="shop">${action} ${icon('arrow',17)}</button></div>`}
function orders(){return `<div class="page-intro"><h1>My orders.</h1><p>Orders placed on this device appear here.</p></div>${state.orders.length?state.orders.map(o=>`<div class="order-card"><div class="order-top"><div><h3>${esc(o.id)}</h3><small>${new Date(o.createdAt).toLocaleString('en-AE')}</small></div><span class="order-status">${o.sent?'WhatsApp handoff':'Saved on device'}</span></div><div class="order-products">${o.items.map(i=>`${esc(i.title)} × ${i.qty}`).join(' · ')}</div><div style="display:flex;justify-content:space-between;align-items:center"><strong>${money(o.total)}</strong><button class="btn btn-soft" data-action="receipt" data-id="${esc(o.id)}">Details ${icon('chevron',14)}</button></div></div>`).join(''):empty('package','No orders yet','When you place an order, you can find its details here.','Start shopping')}`}
function account(){return `<div class="page-intro"><h1>Your FINORA.</h1><p>Everything you need, all in one place.</p></div><div class="profile-grid"><button class="tile" data-action="edit-profile"><span><strong>${state.profile.name?`Hey, ${esc(state.profile.name)} 👋`:'Your details'}</strong><small>Set up your name and phone number</small></span>${icon('chevron')}</button><button class="tile" data-action="view" data-view="orders"><span><strong>Order history</strong><small>${state.orders.length} locally saved order(s)</small></span>${icon('chevron')}</button><button class="tile" data-action="view" data-view="favourites"><span><strong>My wishlist</strong><small>${state.faves.length} saved item(s)</small></span>${icon('chevron')}</button><button class="tile" data-action="about"><span><strong>About FINORA</strong><small>Accounting, trading and more</small></span>${icon('chevron')}</button></div><div class="promo-strip"><div><strong>Need help with an order?</strong><span>${CONFIG.whatsappNumber?'Contact us directly on WhatsApp.':'Add your business WhatsApp number in the file settings to enable chat.'}</span></div><button class="btn btn-primary" data-action="contact" ${!CONFIG.whatsappNumber?'disabled':''}>Contact ${icon('message-circle',15)}</button></div>`}
function footer(){return `<footer><div class="wrap footer-inner"><div><div class="footer-name">FINORA<span>.</span></div><p>FINORA GLOBAL SERVICES FZE · UAE</p><p>Demo catalogue — verify prices and stock before publishing.</p></div><div class="footer-links"><button data-action="view" data-view="shop">Shop</button><button data-action="view" data-view="orders">My orders</button><button data-action="about">About</button><button data-action="contact">Contact</button></div></div></footer>`}
function render(){const page=state.view==='home'?home():state.view==='shop'?shop():state.view==='favourites'?favourites():state.view==='orders'?orders():account();$('#app').innerHTML=header()+`<main class="wrap">${page}</main>`+footer()+mobileNav()}
function navigate(view){if(view==='cart'){openModal('cart');return}state.view=view;state.category='All';state.query='';state.sort='featured';render();window.scrollTo({top:0,behavior:'smooth'})}
function modalFrame(title,body,foot='',wide=false){return `<div class="overlay" data-action="dismiss"><div class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialog-head"><h2>${esc(title)}</h2><button class="close" data-action="close" aria-label="Close">${icon('x',19)}</button></div><div class="dialog-body">${body}</div>${foot?`<div class="dialog-foot">${foot}</div>`:''}</div></div>`}
function updateModal(){document.body.classList.toggle('lock',!!state.modal);if(!state.modal){$('#modalRoot').innerHTML='';return}const m=state.modal;let html='';if(m.type==='cart')html=cartModal();if(m.type==='checkout')html=checkoutModal();if(m.type==='detail')html=detailModal(m.id);if(m.type==='success')html=successModal();if(m.type==='profile')html=profileModal();if(m.type==='receipt')html=receiptModal(m.id);if(m.type==='about')html=aboutModal();$('#modalRoot').innerHTML=html}
function openModal(type,id){state.modal={type,id};updateModal()}
function closeModal(){state.modal=null;state.orderJustPlaced=null;updateModal()}
function cartRows(){return PRODUCTS.filter(p=>state.cart[p.id]>0).map(p=>`<div class="cart-line"><div class="cart-img"><img src="${photo(p)}" alt="${esc(p.title)}"></div><div class="cart-detail"><strong>${esc(p.title)}</strong><small>${p.category}</small><div class="qty"><button data-action="qty" data-id="${p.id}" data-delta="-1" aria-label="Decrease quantity">${icon('minus',13)}</button><b>${state.cart[p.id]}</b><button data-action="qty" data-id="${p.id}" data-delta="1" aria-label="Increase quantity">${icon('plus',13)}</button></div></div><div class="cart-price"><strong>${money(p.price*state.cart[p.id])}</strong><button class="remove" data-action="remove" data-id="${p.id}" aria-label="Remove ${esc(p.title)}">${icon('trash',17)}</button></div></div>`).join('')}
function summary(){const c=calc();return `<div class="summary"><div class="sum-line"><span>Subtotal</span><b>${money(c.sub)}</b></div>${c.discount?`<div class="sum-line"><span>Promo saving</span><b style="color:#119e83">-${money(c.discount)}</b></div>`:''}<div class="sum-line"><span>Delivery</span><b>${c.delivery?money(c.delivery):'FREE'}</b></div><div class="sum-line"><span>Estimated VAT (5%)</span><b>${money(c.vat)}</b></div><div class="sum-line total"><span>Estimated total</span><span>${money(c.total)}</span></div><div class="form-note">Sample prices and tax estimate. Final VAT treatment must be confirmed for your actual products.</div></div>`}
function cartModal(){if(!count())return modalFrame('My bag',`<div class="success"><div class="empty-icon" style="width:75px;height:75px;display:grid;place-items:center;border-radius:22px;background:#eaf7f3;color:#0ba58d">${icon('bag',34)}</div><h2>Your bag feels empty</h2><p>There are amazing things to discover.</p><button class="btn btn-primary" data-action="close">Continue shopping ${icon('arrow',16)}</button></div>`);const c=calc();return modalFrame(`My bag (${count()})`,`${cartRows()}<div class="promo-form"><input class="field" id="promoInput" placeholder="Promo code" value="${esc(state.promo)}" maxlength="20" aria-label="Promo code"><button class="btn btn-soft" data-action="promo">Apply</button></div>${c.sub<CONFIG.freeDeliveryAt?`<div class="form-note">Add ${money(CONFIG.freeDeliveryAt-c.sub)} more for free delivery.</div>`:`<div class="form-note" style="color:#0ba486">✓ Free delivery unlocked</div>`}${summary()}`,`<button class="btn btn-primary btn-wide" data-action="checkout">Checkout · ${money(c.total)} ${icon('arrow',17)}</button>`)}
function checkoutModal(){if(!count())return cartModal();return modalFrame('Checkout',`<form id="checkoutForm"><div class="checkout-section"><h3>01 · Contact & delivery</h3><div class="form-grid"><div class="form-group"><label for="buyerName">Full name *</label><input class="field" id="buyerName" name="name" required maxlength="80" autocomplete="name" value="${esc(state.profile.name||'')}" placeholder="Your full name"></div><div class="form-group"><label for="buyerPhone">Mobile number *</label><input class="field" id="buyerPhone" name="phone" required maxlength="18" inputmode="tel" autocomplete="tel" pattern="[+0-9 ()-]{7,18}" value="${esc(state.profile.phone||'')}" placeholder="+971 5X XXX XXXX"></div></div><div class="form-group"><label for="buyerAddress">Delivery address *</label><textarea class="field" id="buyerAddress" name="address" rows="3" required maxlength="300" placeholder="Building, street, area, emirate">${esc(state.profile.address||'')}</textarea></div><div class="form-group"><label for="buyerNotes">Delivery notes (optional)</label><input class="field" id="buyerNotes" name="notes" maxlength="180" placeholder="Apartment, landmark, instructions"></div></div><div class="checkout-section"><h3>02 · Payment method</h3><label class="pay-option"><input type="radio" name="payment" value="COD" checked><span>${icon('truck',22)}</span><span><strong>Cash on delivery</strong><small>Pay when your order is delivered</small></span></label><div class="pay-option pay-disabled"><span>${icon('credit-card',22)}</span><span><strong>Card / Apple Pay — not connected</strong><small>Requires a real, approved payment gateway</small></span></div><p class="form-note">${CONFIG.whatsappNumber?'After placing your order, WhatsApp opens with the order details. You must press Send to deliver it to FINORA.':'Demo mode: order details are saved on this browser only. Set CONFIG.whatsappNumber to send COD orders to the business via WhatsApp.'}</p></div>${summary()}</form>`,`<button class="btn btn-primary btn-wide" type="submit" form="checkoutForm">Place cash-on-delivery order ${icon('arrow',16)}</button>`)}
function detailModal(id){const p=findProduct(id);if(!p)return '';return modalFrame('Product details',`<div class="detail-image"><img src="${photo(p)}" alt="${esc(p.title)}"></div><span class="product-category">${p.category}</span><h2 class="detail-title">${esc(p.title)}</h2><div class="product-meta"><span>⭐ ${p.rating.toFixed(1)} · Curated choice</span></div><p class="detail-desc">${esc(p.desc)} Sample listing for the FINORA app demonstration.</p><div class="detail-perks"><span>${icon('truck',16)} UAE delivery</span><span>${icon('shield',16)} Local order support</span></div><div style="display:flex;align-items:center;justify-content:space-between;margin:15px 0"><div><div class="price">${money(p.price)}</div><span class="old">${money(p.old)}</span></div><button class="btn btn-soft" data-action="wishlist" data-id="${p.id}">${icon('heart',17)} ${state.faves.includes(p.id)?'Saved':'Save'}</button></div>`,`<button class="btn btn-primary btn-wide" data-action="add" data-id="${p.id}">${icon('plus',17)} Add to bag</button>`,true)}
function successModal(){const o=state.orderJustPlaced;if(!o)return '';return modalFrame('Order placed',`<div class="success"><div class="success-icon">${icon('check',42)}</div><h2>${o.sent?'Order details prepared!':'Order saved on device!'}</h2><p>${o.sent?'WhatsApp has been opened with your order details. Please press Send in WhatsApp to submit your request to FINORA.':'This is a local demo order, not yet received by FINORA. Connect your WhatsApp business number to submit COD orders.'}</p><div class="code">${esc(o.id)}</div><p>Total: <b>${money(o.total)}</b></p><button class="btn btn-primary btn-wide" data-action="view" data-view="orders">View my orders ${icon('arrow',17)}</button>${o.sent?`<button class="btn btn-soft btn-wide" style="margin-top:10px" data-action="send-order" data-id="${esc(o.id)}">Open WhatsApp again ${icon('message-circle',17)}</button>`:''}</div>`)}
function profileModal(){return modalFrame('My details',`<form id="profileForm"><div class="form-group"><label>Name</label><input class="field" name="name" value="${esc(state.profile.name||'')}" maxlength="80" placeholder="Your name" required></div><div class="form-group"><label>Mobile number</label><input class="field" name="phone" value="${esc(state.profile.phone||'')}" maxlength="18" inputmode="tel" placeholder="+971 ..."></div><div class="form-group"><label>Default delivery address</label><textarea class="field" name="address" rows="3" maxlength="300">${esc(state.profile.address||'')}</textarea></div><p class="form-note">These details stay in this browser; do not use on a shared device.</p></form>`,`<button class="btn btn-primary btn-wide" type="submit" form="profileForm">Save details ${icon('check',16)}</button>`)}
function receiptModal(id){const o=state.orders.find(x=>x.id===id);if(!o)return '';return modalFrame('Order details',`<h3>${esc(o.id)}</h3><p class="form-note">${new Date(o.createdAt).toLocaleString('en-AE')}</p><div style="margin:18px 0">${o.items.map(i=>`<div class="sum-line"><span>${esc(i.title)} × ${i.qty}</span><b>${money(i.lineTotal)}</b></div>`).join('')}</div><hr style="border:0;border-top:1px solid var(--line)"><p><strong>Customer:</strong> ${esc(o.customer.name)}</p><p><strong>Phone:</strong> ${esc(o.customer.phone)}</p><p><strong>Address:</strong> ${esc(o.customer.address)}</p><p><strong>Payment:</strong> Cash on delivery</p><p><strong>Total:</strong> ${money(o.total)}</p><p class="form-note">${o.sent?'WhatsApp order handoff prepared; customer must press Send.':'Locally saved demo order only.'}</p>`,`${CONFIG.whatsappNumber?`<button class="btn btn-soft btn-wide" data-action="send-order" data-id="${esc(o.id)}">Send order via WhatsApp ${icon('message-circle',17)}</button>`:''}`)}
function aboutModal(){return modalFrame('About FINORA',`<div style="margin:4px 0 24px">${brand()}</div><h2>Better services. Better shopping.</h2><p class="detail-desc">FINORA GLOBAL SERVICES FZE is presented here as a modern marketplace concept for electronics, groceries, home essentials, office products and lifestyle items, alongside its accounting and general trading services.</p><p class="detail-desc">This single-file demo features product discovery, wishlists, shopping cart, promotions, a cash-on-delivery order flow and locally saved order history.</p><div class="trust-item"><div class="trust-icon">${icon('shield')}</div><div><strong>Before going live</strong><small>Replace sample inventory, enter an order-receiving WhatsApp number, check delivery charges and taxes, and connect a certified payment gateway for card payments.</small></div></div>`)}
function persist(){save('cart',state.cart);save('faves',state.faves);save('orders',state.orders);save('profile',state.profile);save('promo',state.promo)}
function syncUI(){render();if(state.modal)updateModal()}
function add(id,button){const p=findProduct(id);if(!p)return;state.cart[id]=(state.cart[id]||0)+1;persist();if(button&&button.classList.contains('add')){button.classList.remove('burst');void button.offsetWidth;button.classList.add('burst');button.innerHTML=icon('check',20);setTimeout(()=>{if(button.isConnected){button.classList.remove('burst');button.innerHTML=icon('plus',20)}},650); // small, in-button microinteraction
// Avoid rebuilding the tapped product button during its animation.
document.querySelectorAll('.counter').forEach(e=>e.textContent=count());document.querySelectorAll('.head-icons .icon-btn:last-child,.mobile-nav [data-view="cart"]').forEach(e=>{if(!e.querySelector('.counter'))e.insertAdjacentHTML('beforeend',`<i class="counter">${count()}</i>`)});
if(state.modal)updateModal();}else{syncUI()}toast(`${p.title} added to bag`)}
function toggleFavourite(id){id=Number(id);if(state.faves.includes(id))state.faves=state.faves.filter(x=>x!==id);else state.faves.push(id);persist();syncUI();toast(state.faves.includes(id)?'Added to wishlist':'Removed from wishlist')}
function orderMessage(o){return [`New FINORA COD Order: ${o.id}`,`Name: ${o.customer.name}`,`Phone: ${o.customer.phone}`,`Delivery: ${o.customer.address}`,o.customer.notes?`Notes: ${o.customer.notes}`:'','Items:',...o.items.map(i=>`- ${i.title} x${i.qty}: ${money(i.lineTotal)}`),`Total (estimate): ${money(o.total)}`,'Payment: Cash on delivery','Please confirm availability, pricing and delivery.'].filter(Boolean).join('\n')}
function whatsappLink(o){return `https://wa.me/${CONFIG.whatsappNumber.replace(/\D/g,'')}?text=${encodeURIComponent(orderMessage(o))}`}
function placeOrder(form){if(!form.reportValidity())return;const d=new FormData(form),customer={name:String(d.get('name')||'').trim(),phone:String(d.get('phone')||'').trim(),address:String(d.get('address')||'').trim(),notes:String(d.get('notes')||'').trim()};if(customer.name.length<2||customer.phone.replace(/\D/g,'').length<7||customer.address.length<8){toast('Please enter valid delivery details');return}const items=PRODUCTS.filter(p=>state.cart[p.id]>0).map(p=>({id:p.id,title:p.title,qty:state.cart[p.id],price:p.price,lineTotal:p.price*state.cart[p.id]}));if(!items.length)return;const totals=calc();const o={id:`FN-${Date.now().toString(36).toUpperCase()}`,createdAt:new Date().toISOString(),customer,items,total:totals.total,sub:totals.sub,delivery:totals.delivery,vat:totals.vat,discount:totals.discount,sent:!!CONFIG.whatsappNumber};state.orders.unshift(o);state.profile={name:customer.name,phone:customer.phone,address:customer.address};state.cart={};state.promo='';state.orderJustPlaced=o;persist();if(CONFIG.whatsappNumber)window.open(whatsappLink(o),'_blank','noopener,noreferrer');render();openModal('success')}
function copyPromo(){const code='FINORA10';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(code).catch(()=>{});toast('Use code FINORA10 in your cart')}
function applyPromo(){const field=$('#promoInput');const code=(field?.value||'').trim().toUpperCase();if(code==='FINORA10'){state.promo=code;persist();updateModal();toast('10% sample discount applied')}else if(!code){state.promo='';persist();updateModal();toast('Promo removed')}else{toast('Sorry, that code is not valid')}}
// All interactive buttons are handled here.
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='dismiss'){if(e.target===b)closeModal();return}if(a==='close'){closeModal();return}if(a==='view'){closeModal();navigate(b.dataset.view);return}if(a==='cart'){openModal('cart');return}if(a==='add'){add(Number(id),b);return}if(a==='wishlist'){toggleFavourite(id);return}if(a==='detail'){openModal('detail',Number(id));return}if(a==='category'){state.category=b.dataset.category;state.view='shop';render();window.scrollTo({top:0,behavior:'smooth'});return}if(a==='filter'){state.category=b.dataset.category;render();return}if(a==='clear-filters'){state.category='All';state.query='';render();return}if(a==='qty'){const n=(state.cart[id]||0)+Number(b.dataset.delta);if(n<=0)delete state.cart[id];else state.cart[id]=n;persist();syncUI();return}if(a==='remove'){delete state.cart[id];persist();syncUI();toast('Removed from bag');return}if(a==='promo'){applyPromo();return}if(a==='copy-promo'){copyPromo();return}if(a==='checkout'){openModal('checkout');return}if(a==='edit-profile'){openModal('profile');return}if(a==='receipt'){openModal('receipt',id);return}if(a==='about'){openModal('about');return}if(a==='contact'){if(CONFIG.whatsappNumber)window.open(`https://wa.me/${CONFIG.whatsappNumber.replace(/\D/g,'')}`,'_blank','noopener,noreferrer');else toast('Add the WhatsApp number in CONFIG first');return}if(a==='send-order'){const o=state.orders.find(o=>o.id===id);if(o&&CONFIG.whatsappNumber)window.open(whatsappLink(o),'_blank','noopener,noreferrer');return}});
document.addEventListener('input',e=>{if(!['desktopSearch','mobileSearch'].includes(e.target.id))return;state.query=e.target.value;state.category='All';if(state.view!=='shop'){state.view='shop';render();const target=$('#mobileSearch')||$('#desktopSearch');if(target){target.focus();target.setSelectionRange(target.value.length,target.value.length)}return}const cat=$('#catalog');if(cat)cat.outerHTML=catalog();const other=e.target.id==='desktopSearch'?$('#mobileSearch'):$('#desktopSearch');if(other)other.value=state.query});
document.addEventListener('change',e=>{if(e.target.id==='sort'){state.sort=e.target.value;const cat=$('#catalog');if(cat)cat.outerHTML=catalog()}});
document.addEventListener('submit',e=>{if(e.target.id==='checkoutForm'){e.preventDefault();placeOrder(e.target)}if(e.target.id==='profileForm'){e.preventDefault();const d=new FormData(e.target);state.profile={name:String(d.get('name')||'').trim(),phone:String(d.get('phone')||'').trim(),address:String(d.get('address')||'').trim()};persist();closeModal();render();toast('Details saved on this device')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-action="detail"]')){e.preventDefault();openModal('detail',Number(e.target.dataset.id))}});
render();
</script>
</body>
</html>
