<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gulf Fire Shield Trading</title>
<style>
:root{--bg:#fafaf9;--card:#fff;--tx:#1c1917;--mu:#78716c;--ac:#c2410c;--bd:#e7e5e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#292524;--tx:#fafaf9;--mu:#a8a29e;--ac:#fb923c;--bd:#44403c}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#292524;--tx:#fafaf9;--mu:#a8a29e;--ac:#fb923c;--bd:#44403c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Segoe UI,sans-serif}
header{background:#7c2d12;color:#fff;padding:16px}header h1{margin:0;font-size:20px}header p{margin:2px 0 0;opacity:.8;font-size:13px}
.tabs{display:flex;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);z-index:2}
.tabs button{flex:1;padding:12px;border:0;background:none;color:var(--mu);font-size:15px;font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ac);border-color:var(--ac)}
main{padding:12px;max-width:720px;margin:auto}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.chips button{white-space:nowrap;padding:7px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}
.item b{display:block}.item small{color:var(--mu)}
.add{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600}
.row{display:grid;grid-template-columns:1fr 64px 84px;gap:6px;align-items:center;margin-bottom:8px}
.row input{padding:8px}.tot{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:12px 0}
.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .g{font-weight:700;font-size:18px;border-top:1px solid var(--bd);margin-top:6px;padding-top:8px}
textarea{width:100%;height:220px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:13px/1.4 ui-monospace,monospace}
.mu{color:var(--mu);font-size:13px}.del{background:none;border:0;color:var(--mu);font-size:18px}
</style></head><body>
<header><h1>🔥 Gulf Fire Shield Trading</h1><p>Product catalog &amp; quotation tool</p></header>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">Catalog</button><button id="t2" onclick="tab(2)">Quote (<span id="n">0</span>)</button></div>
<main>
<section id="v1"><input id="q" placeholder="Search products…" oninput="draw()"><div class="chips" id="chips"></div><div id="list"></div></section>
<section id="v2" hidden>
<input id="cust" placeholder="Customer / company name" oninput="quote()" style="margin-bottom:8px">
<div id="cart"></div>
<div class="tot"><div><span>Subtotal</span><span id="sub"></span></div>
<div><span>VAT <input id="vat" type="number" value="5" oninput="quote()" style="width:60px;padding:4px;display:inline"> %</span><span id="vt"></span></div>
<div class="g"><span>Total (AED)</span><span id="tt"></span></div></div>
<textarea id="out" readonly></textarea>
<p class="mu">Prices are sample placeholders. Edit any price or quantity in the quote. Tap the text above, select all, and copy to send via WhatsApp or email.</p>
</section></main>
<script>
const P=[["Extinguishers","ABC Dry Powder 6kg",95],["Extinguishers","CO2 Extinguisher 5kg",260],["Extinguishers","Foam Extinguisher 9L",140],["Extinguishers","Fire Blanket 1.2m",45],
["Alarms & Detection","Smoke Detector (Addressable)",85],["Alarms & Detection","Heat Detector",80],["Alarms & Detection","Manual Call Point",55],["Alarms & Detection","Fire Alarm Panel 4-Zone",750],
["Sprinklers & Hoses","Sprinkler Head 68°C",18],["Sprinklers & Hoses","Fire Hose Reel 30m",680],["Sprinklers & Hoses","Fire Hydrant Valve 2.5\"",320],["Sprinklers & Hoses","Landing Valve",290],
["Safety Signs & PPE","Emergency Exit Sign (LED)",75],["Safety Signs & PPE","Emergency Light",90],["Safety Signs & PPE","Fire Fighting Suit",900]];
let cat="All",cart={},cs=["All",...new Set(P.map(p=>p[0]))];
const $=id=>document.getElementById(id),f=n=>n.toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:2});
function tab(i){$("v1").hidden=i!=1;$("v2").hidden=i!=2;$("t1").className=i==1?"on":"";$("t2").className=i==2?"on":"";if(i==2)quote()}
function draw(){const s=$("q").value.toLowerCase();
$("chips").innerHTML=cs.map(c=>`<button class="${c==cat?"on":""}" onclick="cat='${c.replace(/'/g,"")}';draw()">${c}</button>`).join("");
$("list").innerHTML=P.map((p,i)=>[p,i]).filter(([p])=>(cat=="All"||p[0]==cat)&&p[1].toLowerCase().includes(s)).map(([p,i])=>`<div class="item"><div><b>${p[1]}</b><small>${p[0]} · AED ${f(p[2])}</small></div><button class="add" onclick="add(${i})">Add</button></div>`).join("")||'<p class="mu">No products found.</p>'}
function add(i){cart[i]=cart[i]||{q:0,p:P[i][2]};cart[i].q++;$("n").textContent=Object.keys(cart).length}
function set(i,k,v){cart[i][k]=+v||0;quote(1)}
function rm(i){delete cart[i];$("n").textContent=Object.keys(cart).length;quote()}
function quote(keep){const ids=Object.keys(cart);let sub=0,lines=[];
if(!keep)$("cart").innerHTML=ids.length?ids.map(i=>`<div class="row"><div><b>${P[i][1]}</b> <button class="del" onclick="rm(${i})">✕</button></div><input type="number" value="${cart[i].q}" min="0" oninput="set(${i},'q',this.value)"><input type="number" value="${cart[i].p}" oninput="set(${i},'p',this.value)"></div>`).join(""):'<p class="mu">No items yet. Add products from the Catalog.</p>';
ids.forEach(i=>{const t=cart[i].q*cart[i].p;sub+=t;lines.push(`${cart[i].q} x ${P[i][1]} @ ${f(cart[i].p)} = ${f(t)}`)});
const v=sub*(+$("vat").value||0)/100;$("sub").textContent=f(sub);$("vt").textContent=f(v);$("tt").textContent=f(sub+v);
$("out").value=`QUOTATION - Gulf Fire Shield Trading\nDate: ${new Date().toLocaleDateString("en-GB")}\nCustomer: ${$("cust").value||"-"}\n\n${lines.join("\n")}\n\nSubtotal: AED ${f(sub)}\nVAT (${$("vat").value||0}%): AED ${f(v)}\nTOTAL: AED ${f(sub+v)}`}
draw();quote();
</script></body></html>
